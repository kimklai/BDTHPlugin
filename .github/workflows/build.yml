name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, _1.6.9]
    tags:
      - '*'
  pull_request:
    branches: [main, _1.6.9]

env:
  PROJECT_NAME: BDTHPlugin
  DALAMUD_VERSION: 13.0.0.16

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Checkout Dalamud API 13
        run: |
          git clone --branch $env:DALAMUD_VERSION --depth 1 --recurse-submodules https://github.com/goatcorp/Dalamud.git _dalamud

      - name: Build Dalamud API 13 dev files
        run: |
          dotnet build .\_dalamud\Dalamud\Dalamud.csproj --configuration Debug

      - name: Build plugin
        env:
          DALAMUD_HOME: ${{ github.workspace }}\_dalamud\bin\Debug
          DOTNET_CLI_TELEMETRY_OUTPUT: true
        run: |
          dotnet restore
          dotnet build --configuration Release --nologo --property:OutputPath=D:/build
          Get-ChildItem D:/build

      - name: Create artifact
        run: |
          Compress-Archive -Path "D:/build/*" -DestinationPath "D:/build/${{ env.PROJECT_NAME }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}
          path: D:/build/${{ env.PROJECT_NAME }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: BDTHPlugin
          path: release-artifact

      - name: Get tag name
        id: tag
        uses: WyriHaximus/github-action-get-previous-tag@v1

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PROJECT_NAME }} ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          body: ${{ github.event.head_commit.message || format('{0} release', env.PROJECT_NAME) }}
          files: release-artifact/${{ env.PROJECT_NAME }}.zip

      - name: Trigger plugin repo update
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.PAT }}
          repository: LeonBlade/DalamudPlugins
          event-type: new-release
